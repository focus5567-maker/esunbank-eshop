server:
  port: 8080

spring:
  application:
    name: esunbank-eshop-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/esunbank_eshop
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true

logging:
  level:
    com.esun.eshop.mapper: debug